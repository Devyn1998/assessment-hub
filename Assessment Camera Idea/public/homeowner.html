<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Home Assessment — Live Session</title>
<script src="/rtc-config.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#000; font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; overflow:hidden; }
  #stage { position:relative; width:100vw; height:100vh; background:#000; }
  #localVideo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#111; }
  #overlay { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #remoteBox {
    position:absolute; top:14px; right:14px; width:110px; height:150px;
    border-radius:12px; overflow:hidden; border:2px solid rgba(255,255,255,.85);
    box-shadow:0 4px 14px rgba(0,0,0,.5); background:#222; z-index:20;
  }
  #remoteBox video { width:100%; height:100%; object-fit:cover; }
  #remoteLabel { position:absolute; bottom:0; left:0; right:0; font-size:10px; text-align:center; background:rgba(0,0,0,.55); color:#fff; padding:2px 0; }
  #status {
    position:absolute; top:14px; left:14px; z-index:20; color:#fff; background:rgba(0,0,0,.5);
    padding:6px 10px; border-radius:8px; font-size:12px; max-width:60vw;
  }
  #dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#e33; margin-right:6px; }
  #dot.live { background:#3ecf5f; }
  #crosshair {
    position:absolute; top:50%; left:50%; width:36px; height:36px; margin:-18px 0 0 -18px;
    border:2px solid #ffcc00; border-radius:50%; z-index:15; display:none; pointer-events:none;
    transition: border-color .15s;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:#ffcc00;
  }
  #crosshair::before { left:50%; top:-6px; bottom:-6px; width:2px; margin-left:-1px; }
  #crosshair::after { top:50%; left:-6px; right:-6px; height:2px; margin-top:-1px; }
  #crosshair.hit { border-color:#3ecf5f; }
  #crosshair.hit::before, #crosshair.hit::after { background:#3ecf5f; }

  #controls {
    position:absolute; left:0; right:0; bottom:0; z-index:20; padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0));
    display:flex; flex-direction:column; gap:8px; align-items:stretch;
  }
  .row { display:flex; gap:8px; }
  button {
    flex:1; border:0; border-radius:10px; padding:13px 10px; font-size:14px; font-weight:600;
    background:#1e6fe0; color:#fff; -webkit-tap-highlight-color:transparent;
  }
  button.secondary { background:#3a3a3a; }
  button.danger { background:#c0392b; }
  button:disabled { opacity:.4; }
  #measureBanner {
    position:absolute; top:60px; left:14px; right:130px; z-index:20; color:#fff;
    background:rgba(0,0,0,.55); padding:8px 10px; border-radius:8px; font-size:13px; display:none;
  }
  #resultCard {
    position:absolute; left:14px; right:14px; bottom:100px; z-index:25; background:rgba(20,20,20,.92);
    color:#fff; border-radius:12px; padding:14px; display:none; text-align:center;
  }
  #resultCard .big { font-size:26px; font-weight:700; margin:4px 0; }
  #freezeCanvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; z-index:5; background:#000; }
  #calibForm {
    position:absolute; left:14px; right:14px; bottom:100px; z-index:25; background:rgba(20,20,20,.92);
    color:#fff; border-radius:12px; padding:14px; display:none;
  }
  #calibForm input { width:100%; padding:10px; border-radius:8px; border:0; font-size:16px; margin:8px 0; }
  #calibForm .row { margin-top:8px; }
  small.hint { color:#bbb; display:block; margin-top:4px; }
</style>
</head>
<body>
<div id="stage">
  <video id="localVideo" autoplay playsinline muted></video>
  <canvas id="freezeCanvas"></canvas>
  <canvas id="overlay"></canvas>
  <div id="crosshair"></div>

  <div id="remoteBox">
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="remoteLabel">Assessor</div>
  </div>

  <div id="status"><span id="dot"></span><span id="statusText">Connecting…</span></div>
  <div id="measureBanner"></div>

  <div id="resultCard">
    <div id="resultLabel">Distance</div>
    <div class="big" id="resultBig">—</div>
    <div class="row" style="margin-top:10px;">
      <button class="secondary" id="resultCloseBtn">Close</button>
    </div>
  </div>

  <div id="calibForm">
    <div>Enter the real-world length of the line you just drew:</div>
    <input id="calibInput" type="number" step="0.1" inputmode="decimal" placeholder="e.g. 36" />
    <div class="row">
      <select id="calibUnit" style="flex:1; padding:10px; border-radius:8px; border:0; font-size:16px;">
        <option value="in">inches</option>
        <option value="ft">feet</option>
      </select>
    </div>
    <small class="hint">Use something already in frame with a known size (a door, a yardstick, a sheet of paper).</small>
    <div class="row" style="margin-top:10px;">
      <button class="secondary" id="calibCancelBtn">Cancel</button>
      <button id="calibConfirmBtn">Use this</button>
    </div>
  </div>

  <div id="controls">
    <div class="row">
      <button id="arBtn" style="display:none;">Start AR Measure</button>
      <button id="manualBtn" class="secondary">Measure on Photo</button>
    </div>
    <div class="row" id="arActiveRow" style="display:none;">
      <button id="arPlaceBtn">Drop Pin</button>
      <button id="arCancelBtn" class="danger">Cancel</button>
    </div>
    <div class="row" id="camRow">
      <button id="flipBtn" class="secondary">Flip Camera</button>
      <button id="muteBtn" class="secondary">Mute Mic</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const localVideo = $('localVideo');
const remoteVideo = $('remoteVideo');
const overlay = $('overlay');
const octx = overlay.getContext('2d');
const freezeCanvas = $('freezeCanvas');
const statusText = $('statusText');
const dot = $('dot');
const crosshair = $('crosshair');
const measureBanner = $('measureBanner');
const resultCard = $('resultCard');
const resultBig = $('resultBig');
const resultLabel = $('resultLabel');
const calibForm = $('calibForm');
const calibInput = $('calibInput');
const calibUnit = $('calibUnit');

function resizeOverlay() {
  overlay.width = window.innerWidth;
  overlay.height = window.innerHeight;
  freezeCanvas.width = window.innerWidth;
  freezeCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeOverlay);
resizeOverlay();

// ---------- Room / signaling ----------
const roomId = location.pathname.split('/').pop();
const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${wsProto}://${location.host}`);
let pc = null;
let localStream = null;
let currentFacing = 'environment';

function setStatus(text, live) {
  statusText.textContent = text;
  dot.classList.toggle('live', !!live);
}

ws.addEventListener('open', () => {
  ws.send(JSON.stringify({ type: 'join', roomId, role: 'homeowner' }));
});

ws.addEventListener('message', async (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === 'joined') {
    setStatus('Waiting for assessor…', false);
  } else if (msg.type === 'peer-joined' && msg.role === 'operator') {
    setStatus('Assessor connected — setting up video…', false);
  } else if (msg.type === 'peer-left' && msg.role === 'operator') {
    setStatus('Assessor disconnected', false);
  } else if (msg.type === 'offer') {
    await ensurePC();
    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    ws.send(JSON.stringify({ type: 'answer', sdp: pc.localDescription }));
  } else if (msg.type === 'answer') {
    if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
  } else if (msg.type === 'ice-candidate') {
    if (pc && msg.candidate) {
      try { await pc.addIceCandidate(msg.candidate); } catch (e) { console.warn(e); }
    }
  }
});

async function ensurePC() {
  if (pc) return;
  pc = new RTCPeerConnection({ iceServers: window.HUD_ICE_SERVERS });
  if (localStream) {
    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  }
  pc.onicecandidate = (e) => {
    if (e.candidate) ws.send(JSON.stringify({ type: 'ice-candidate', candidate: e.candidate }));
  };
  pc.ontrack = (e) => {
    remoteVideo.srcObject = e.streams[0];
    setStatus('Live', true);
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') setStatus('Live', true);
    if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) setStatus('Connection lost', false);
  };
  // The camera permission prompt can take a few seconds for the person to
  // tap "Allow" — often longer than it takes the operator's offer to
  // arrive. When that happens, the initial answer goes out with no local
  // track, and startCamera() below has to add the track *after* the
  // connection is already established. Adding a track post-negotiation
  // doesn't take effect on its own — it fires negotiationneeded, and this
  // handler is what actually renegotiates so the operator ends up
  // receiving the video.
  let negotiating = false;
  pc.onnegotiationneeded = async () => {
    if (negotiating) return;
    negotiating = true;
    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription }));
    } catch (e) {
      console.warn('renegotiation failed', e);
    } finally {
      negotiating = false;
    }
  };
}

async function startCamera(facing) {
  const constraints = {
    audio: true,
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }
  };
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  localVideo.srcObject = stream;
  if (localStream) {
    localStream.getTracks().forEach((t) => t.stop());
  }
  localStream = stream;
  if (pc) {
    const senders = pc.getSenders();
    stream.getTracks().forEach((track) => {
      const sender = senders.find((s) => s.track && s.track.kind === track.kind);
      if (sender) sender.replaceTrack(track); else pc.addTrack(track, stream);
    });
  }
}

startCamera(currentFacing).then(() => ensurePC()).catch((err) => {
  setStatus('Camera access denied — allow camera to continue', false);
  console.error(err);
});

$('flipBtn').addEventListener('click', () => {
  currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
  startCamera(currentFacing).catch(console.error);
});

let muted = false;
$('muteBtn').addEventListener('click', () => {
  muted = !muted;
  if (localStream) localStream.getAudioTracks().forEach((t) => (t.enabled = !muted));
  $('muteBtn').textContent = muted ? 'Unmute Mic' : 'Mute Mic';
});

function sendMeasurement(payload) {
  ws.send(JSON.stringify({ type: 'measurement', ...payload }));
}

function formatMeters(m) {
  const totalIn = m * 39.3701;
  const ft = Math.floor(totalIn / 12);
  const inch = Math.round((totalIn - ft * 12) * 10) / 10;
  return { feet: ft, inches: inch, label: `${ft}' ${inch}"`, meters: Math.round(m * 100) / 100 };
}

// ---------- AR measurement (WebXR hit-test, Android Chrome / ARCore) ----------
const arBtn = $('arBtn');
const arActiveRow = $('arActiveRow');
const arPlaceBtn = $('arPlaceBtn');
const arCancelBtn = $('arCancelBtn');
let xrSession = null;
let xrHitPose = null;
let arPoint1 = null;

async function checkAR() {
  if (navigator.xr && navigator.xr.isSessionSupported) {
    try {
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (supported) arBtn.style.display = '';
    } catch (e) { /* not supported */ }
  }
}
checkAR();

arBtn.addEventListener('click', startAR);
arCancelBtn.addEventListener('click', () => endAR(true));
arPlaceBtn.addEventListener('click', placeARPoint);

async function startAR() {
  try {
    const glCanvas = document.createElement('canvas');
    const gl = glCanvas.getContext('webgl', { xrCompatible: true });
    await gl.makeXRCompatible();

    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test']
    });
    xrSession.updateRenderState({ baseLayer: new XRWebGLLayer(xrSession, gl) });

    const refSpace = await xrSession.requestReferenceSpace('local');
    const viewerSpace = await xrSession.requestReferenceSpace('viewer');
    const hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

    arPoint1 = null;
    xrHitPose = null;
    arBtn.style.display = 'none';
    arActiveRow.style.display = '';
    $('camRow').style.display = 'none';
    $('manualBtn').style.display = 'none';
    crosshair.style.display = '';
    measureBanner.style.display = '';
    measureBanner.textContent = 'Point the crosshair at one wall, then tap "Drop Pin".';

    xrSession.addEventListener('end', () => onAREnd());

    function onXRFrame(t, frame) {
      if (!xrSession) return;
      xrSession.requestAnimationFrame(onXRFrame);
      const layer = xrSession.renderState.baseLayer;
      gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      const hits = frame.getHitTestResults(hitTestSource);
      if (hits.length > 0) {
        const pose = hits[0].getPose(refSpace);
        xrHitPose = pose.transform.position;
        crosshair.classList.add('hit');
      } else {
        xrHitPose = null;
        crosshair.classList.remove('hit');
      }
    }
    xrSession.requestAnimationFrame(onXRFrame);
  } catch (err) {
    console.error(err);
    alert('AR measurement is not available on this device/browser. Use "Measure on Photo" instead.');
    endAR(true);
  }
}

function placeARPoint() {
  if (!xrHitPose) return;
  if (!arPoint1) {
    arPoint1 = { ...xrHitPose };
    measureBanner.textContent = 'Point 1 set. Walk/pan to the opposite wall and tap "Drop Pin" again.';
  } else {
    const p2 = xrHitPose;
    const dx = p2.x - arPoint1.x, dy = p2.y - arPoint1.y, dz = p2.z - arPoint1.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const f = formatMeters(dist);
    showResult('Wall-to-wall (AR)', f.label, `${f.meters} m`);
    sendMeasurement({ mode: 'ar', distanceMeters: f.meters, label: f.label });
    endAR(false);
  }
}

function endAR(cancelled) {
  if (xrSession) {
    try { xrSession.end(); } catch (e) {}
  }
  onAREnd(cancelled);
}

function onAREnd() {
  xrSession = null;
  xrHitPose = null;
  arPoint1 = null;
  crosshair.style.display = 'none';
  crosshair.classList.remove('hit');
  measureBanner.style.display = 'none';
  arActiveRow.style.display = 'none';
  $('camRow').style.display = '';
  $('manualBtn').style.display = '';
  checkAR();
}

// ---------- Manual "measure on photo" fallback (works on any device) ----------
const manualBtn = $('manualBtn');
let frozen = false;
let calibPts = [];
let targetPts = [];
let stage = null; // 'calib' | 'target'
let pxPerUnit = null; // pixels per inch

manualBtn.addEventListener('click', () => {
  const fctx = freezeCanvas.getContext('2d');
  const vw = localVideo.videoWidth, vh = localVideo.videoHeight;
  if (!vw) return;
  // Draw video (object-fit:cover) onto the freeze canvas at screen size.
  const cw = freezeCanvas.width, ch = freezeCanvas.height;
  const scale = Math.max(cw / vw, ch / vh);
  const dw = vw * scale, dh = vh * scale;
  const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
  fctx.drawImage(localVideo, dx, dy, dw, dh);
  freezeCanvas.style.display = '';
  frozen = true;
  calibPts = []; targetPts = []; pxPerUnit = null;
  stage = 'calib';
  octx.clearRect(0, 0, overlay.width, overlay.height);
  measureBanner.style.display = '';
  measureBanner.textContent = 'Tap the two ends of a known-size object (step 1 of 2).';
  manualBtn.textContent = 'Cancel Photo Measure';
  manualBtn.onclick = cancelManual;
  arBtn.style.display = 'none';
});

function cancelManual() {
  // Simplest reliable way to fully reset AR/manual state + listeners.
  location.reload();
}

overlay.addEventListener('pointerdown', (e) => {
  if (!frozen) return;
  if (calibForm.style.display === 'block') return;
  const x = e.clientX, y = e.clientY;
  if (stage === 'calib') {
    calibPts.push({ x, y });
    drawPoint(x, y, '#ffcc00');
    if (calibPts.length === 2) {
      drawLine(calibPts[0], calibPts[1], '#ffcc00');
      calibForm.style.display = 'block';
    }
  } else if (stage === 'target') {
    targetPts.push({ x, y });
    drawPoint(x, y, '#3ecf5f');
    if (targetPts.length === 2) {
      drawLine(targetPts[0], targetPts[1], '#3ecf5f');
      const dx = targetPts[1].x - targetPts[0].x, dy = targetPts[1].y - targetPts[0].y;
      const pxDist = Math.sqrt(dx * dx + dy * dy);
      const inches = pxDist / pxPerUnit;
      const meters = inches * 0.0254;
      const f = formatMeters(meters);
      measureBanner.style.display = 'none';
      const thumb = freezeCanvas.toDataURL('image/jpeg', 0.5);
      showResult('Wall-to-wall (estimated)', f.label, `${f.meters} m — calibrated estimate`);
      sendMeasurement({ mode: 'manual', distanceMeters: f.meters, label: f.label, thumb });
    }
  }
});

function drawPoint(x, y, color) {
  octx.fillStyle = color;
  octx.beginPath();
  octx.arc(x, y, 8, 0, Math.PI * 2);
  octx.fill();
}
function drawLine(a, b, color) {
  octx.strokeStyle = color;
  octx.lineWidth = 3;
  octx.beginPath();
  octx.moveTo(a.x, a.y);
  octx.lineTo(b.x, b.y);
  octx.stroke();
}

$('calibCancelBtn').addEventListener('click', () => {
  calibPts = [];
  octx.clearRect(0, 0, overlay.width, overlay.height);
  calibForm.style.display = 'none';
  measureBanner.textContent = 'Tap the two ends of a known-size object (step 1 of 2).';
});

$('calibConfirmBtn').addEventListener('click', () => {
  const val = parseFloat(calibInput.value);
  if (!val || val <= 0) { calibInput.focus(); return; }
  const inches = calibUnit.value === 'ft' ? val * 12 : val;
  const dx = calibPts[1].x - calibPts[0].x, dy = calibPts[1].y - calibPts[0].y;
  const pxDist = Math.sqrt(dx * dx + dy * dy);
  pxPerUnit = pxDist / inches;
  calibForm.style.display = 'none';
  calibInput.value = '';
  stage = 'target';
  measureBanner.style.display = '';
  measureBanner.textContent = 'Now tap the two wall points you want to measure (step 2 of 2).';
});

function showResult(label, big, sub) {
  resultLabel.textContent = label;
  resultBig.textContent = big;
  resultCard.querySelector('#resultBig').nextSibling; // no-op
  resultCard.style.display = 'block';
  let subEl = resultCard.querySelector('.sub');
  if (!subEl) {
    subEl = document.createElement('div');
    subEl.className = 'sub';
    subEl.style.cssText = 'color:#aaa;font-size:12px;margin-bottom:6px;';
    resultCard.insertBefore(subEl, resultCard.querySelector('.row'));
  }
  subEl.textContent = sub || '';
}

$('resultCloseBtn').addEventListener('click', () => {
  resultCard.style.display = 'none';
  if (frozen) cancelManual();
});
</script>
</body>
</html>
