<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Home Assessment — Live Session</title>
<script src="/rtc-config.js"></script>
<style>
  /* Homeowner-facing view. Deliberately quieter than the operator console:
     the customer is holding this at arm's length while being talked through
     a visit, so it uses the same design tokens but bigger tap targets,
     higher contrast over live video, and no dense data chrome. */
  :root {
    color-scheme: dark;
    --accent:#2f6feb;
    --accent-hi:#3f7df5;
    --panel:#15181d;
    --line:rgba(255,255,255,.14);
    --text:#f2f4f7;
    --text-2:#b3bac4;
    --ok:#2fa36b;
    --danger:#d1493f;
    --r-md:10px;
    --r-lg:14px;
    --sans:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --scrim:rgba(10,12,15,.62);
  }
  * { box-sizing:border-box; }
  html, body {
    margin:0; padding:0; height:100%; background:#000;
    font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #stage { position:relative; width:100vw; height:100vh; height:100dvh; background:#000; }
  #localVideo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#0a0c0f; }

  #remoteBox {
    position:absolute; top:14px; right:14px; width:112px; height:150px;
    border-radius:var(--r-md); overflow:hidden; border:1px solid rgba(255,255,255,.3);
    box-shadow:0 8px 22px rgba(0,0,0,.55); background:#000; z-index:20;
  }
  #remoteBox video { width:100%; height:100%; object-fit:cover; }
  #remoteLabel {
    position:absolute; bottom:0; left:0; right:0; font-size:9px; text-align:center;
    background:rgba(10,12,15,.78); color:#fff; padding:3px 0;
    text-transform:uppercase; letter-spacing:.12em; font-weight:700;
  }

  #status {
    position:absolute; top:40px; left:14px; z-index:20; color:var(--text);
    background:var(--scrim); backdrop-filter:blur(8px);
    border:1px solid var(--line); padding:6px 12px; border-radius:99px;
    font-size:11.5px; max-width:60vw; display:flex; align-items:center;
  }
  #dot {
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--danger); margin-right:7px; flex:0 0 auto;
  }
  #dot.live { background:var(--ok); box-shadow:0 0 0 3px rgba(47,163,107,.2); }

  #promoBanner {
    position:absolute; top:0; left:0; right:0; height:26px; z-index:22;
    background:rgba(10,12,15,.8); overflow:hidden; display:none;
    border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
  }
  #promoBanner .marquee-text {
    display:inline-block; white-space:nowrap; padding-left:100%;
    line-height:26px; font-size:11px; font-weight:600; color:#e8bd6d;
    letter-spacing:.04em; animation:promoMarquee 9s linear infinite;
  }
  @keyframes promoMarquee {
    0% { transform:translateX(0); }
    100% { transform:translateX(-100%); }
  }

  #crosshair {
    position:absolute; top:50%; left:50%; width:38px; height:38px; margin:-19px 0 0 -19px;
    border:2px solid rgba(255,255,255,.85); border-radius:50%; z-index:15;
    display:none; pointer-events:none; transition:border-color .15s ease;
  }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,255,255,.85); }
  #crosshair::before { left:50%; top:-7px; bottom:-7px; width:2px; margin-left:-1px; }
  #crosshair::after { top:50%; left:-7px; right:-7px; height:2px; margin-top:-1px; }
  #crosshair.hit { border-color:var(--ok); }
  #crosshair.hit::before, #crosshair.hit::after { background:var(--ok); }

  #controls {
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    padding:16px 14px calc(34px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(6,8,11,.86), rgba(6,8,11,0));
    display:flex; flex-direction:column; gap:9px; align-items:stretch;
  }
  .row { display:flex; gap:9px; }
  button {
    flex:1; border:1px solid transparent; border-radius:var(--r-md);
    padding:14px 12px; font-size:14.5px; font-weight:600; font-family:inherit;
    background:var(--accent); color:#fff; -webkit-tap-highlight-color:transparent;
    transition:background .12s ease;
  }
  button:active:not(:disabled) { background:var(--accent-hi); }
  button.secondary { background:rgba(28,32,39,.9); border-color:var(--line); color:var(--text); }
  button.danger { background:var(--danger); }
  button:disabled { opacity:.4; }

  #measureBanner {
    position:absolute; top:60px; left:14px; right:136px; z-index:20; color:var(--text);
    background:var(--scrim); backdrop-filter:blur(8px); border:1px solid var(--line);
    padding:10px 12px; border-radius:var(--r-md); font-size:13px; display:none; line-height:1.45;
  }

  #resultCard {
    position:absolute; left:14px; right:14px; bottom:104px; z-index:25;
    background:rgba(21,24,29,.95); backdrop-filter:blur(10px);
    color:var(--text); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:16px; display:none; text-align:center;
    box-shadow:0 16px 44px rgba(0,0,0,.55);
  }
  #resultCard #resultLabel {
    font-size:10px; text-transform:uppercase; letter-spacing:.14em;
    color:var(--text-2); font-weight:700;
  }
  #resultCard .big {
    font-size:28px; font-weight:700; margin:6px 0 2px; letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
  }
  #freezeCanvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; z-index:5; background:#000; }

  /* ---- Modals ---- */
  #moodModal {
    position:fixed; inset:0; z-index:60; background:rgba(6,8,11,.78);
    backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #moodModal .mood-card {
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:30px 24px; text-align:center; max-width:360px; width:100%;
    box-shadow:0 20px 56px rgba(0,0,0,.6);
  }
  #moodModal .mood-title { font-size:16px; font-weight:600; margin-bottom:22px; color:var(--text); line-height:1.4; }
  #moodModal .mood-options { display:flex; justify-content:center; gap:16px; }
  .mood-btn {
    width:78px; height:78px; border-radius:50%; font-size:34px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    border:2px solid transparent; background:rgba(255,255,255,.06);
    -webkit-tap-highlight-color:transparent;
  }
  .mood-btn.sad { border-color:rgba(209,73,63,.6); background:rgba(209,73,63,.12); }
  .mood-btn.meh { border-color:rgba(201,146,48,.6); background:rgba(201,146,48,.12); }
  .mood-btn.happy { border-color:rgba(47,163,107,.6); background:rgba(47,163,107,.12); }

</style>
</head>
<body>
<div id="stage">
  <video id="localVideo" autoplay playsinline muted></video>
  <canvas id="freezeCanvas"></canvas>
  <div id="crosshair"></div>

  <div id="remoteBox">
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="remoteLabel">Assessor</div>
  </div>

  <div id="promoBanner"><span class="marquee-text">explore our other options for no money out of pocket upgrades</span></div>
  <div id="status"><span id="dot"></span><span id="statusText">Connecting…</span></div>
  <div id="measureBanner"></div>

  <div id="resultCard">
    <div id="resultLabel">Distance</div>
    <div class="big" id="resultBig">—</div>
    <div class="row" style="margin-top:10px;">
      <button class="secondary" id="resultCloseBtn">Close</button>
    </div>
  </div>

  <div id="moodModal">
    <div class="mood-card">
      <div class="mood-title">How are you feeling about today's visit?</div>
      <div class="mood-options">
        <button class="mood-btn sad" data-mood="sad" data-emoji="😞">😞</button>
        <button class="mood-btn meh" data-mood="meh" data-emoji="😐">😐</button>
        <button class="mood-btn happy" data-mood="happy" data-emoji="😊">😊</button>
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="row">
      <button id="arBtn" style="display:none;">Enable AR (one tap)</button>
    </div>
    <div class="row" id="camRow">
      <button id="flipBtn" class="secondary">Flip Camera</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const localVideo = $('localVideo');
const remoteVideo = $('remoteVideo');
const freezeCanvas = $('freezeCanvas');
const statusText = $('statusText');
const dot = $('dot');
const crosshair = $('crosshair');
const measureBanner = $('measureBanner');
const resultCard = $('resultCard');
const resultBig = $('resultBig');
const resultLabel = $('resultLabel');

function resizeCanvases() {
  freezeCanvas.width = window.innerWidth;
  freezeCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvases);
resizeCanvases();

// ---------- Room / signaling ----------
const roomId = location.pathname.split('/').pop();
const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
// A phone drops this socket every time the screen locks or the browser goes
// to the background — and as a `const` with no close handler, the session was
// simply dead from then on. Reconnect with backoff and re-join the room.
let ws = null;
let wsRetry = 0;
let wsClosedByUs = false;
function connectWS() {
  ws = new WebSocket(`${wsProto}://${location.host}`);
  wireWs(ws);
}
let pc = null;
let localStream = null;
let currentFacing = 'environment';
// "Perfect negotiation" glare guard: if your camera permission resolves
// quickly, this page can self-trigger an offer (see onnegotiationneeded
// below) at roughly the same moment the operator sends its own initial
// offer. Homeowner is the "polite" side — it yields (rolls back) instead
// of throwing when that collision happens; see operator.html for the
// impolite counterpart.
let makingOffer = false;

// Camera permission can resolve (and trigger ICE gathering / renegotiation)
// before this signaling socket finishes connecting, especially on a slow
// mobile network. Sending on a CONNECTING socket throws and silently drops
// the message, so route every outgoing message through here: send now if
// open, otherwise queue and flush once the socket opens.
const wsQueue = [];
function wireWs(sock) {
  sock.addEventListener('open', onWsOpen);
  sock.addEventListener('message', onWsMessage);
  sock.addEventListener('close', () => {
    if (wsClosedByUs) return;
    setStatus('Reconnecting…', false);
    const delay = Math.min(1000 * Math.pow(2, wsRetry++), 10000);
    setTimeout(connectWS, delay);
  });
  sock.addEventListener('error', () => { try { sock.close(); } catch (e) {} });
}

function wsSend(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msg));
  } else {
    wsQueue.push(msg);
  }
}
function onWsOpen() {
  wsRetry = 0;
  // Re-announce on every (re)connect, not just the first.
  ws.send(JSON.stringify({ type: 'join', roomId, role: 'homeowner' }));
  while (wsQueue.length) ws.send(JSON.stringify(wsQueue.shift()));
  trySendMood();
  setStatus('Waiting for assessor…', false);
}

function setStatus(text, live) {
  statusText.textContent = text;
  dot.classList.toggle('live', !!live);
  if (live && !callStarted) {
    callStarted = true;
    scheduleBanner(0); // first appearance right at the start of the call
    startHomeownerSpeechRecognition();
  }
}

// ---------- Speech transcript feed for the assessor's checklist ----------
// Browser-native speech recognition (Chrome only — silently does nothing
// on Safari/iOS since that API isn't supported there). Transcribes the
// homeowner's own mic locally and forwards finished phrases to the
// operator, who matches them against the assessment checklist.
function startHomeownerSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return; // not supported on this browser/device — skip quietly
  try {
    const recog = new SR();
    recog.continuous = true;
    recog.interimResults = false;
    recog.lang = 'en-US';
    recog.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          const text = e.results[i][0].transcript;
          if (text && text.trim()) {
            wsSend({ type: 'speech-transcript', text });
          }
        }
      }
    };
    recog.onerror = () => {};
    recog.onend = () => {
      // Chrome stops recognition periodically on its own; keep it going for the call.
      try { recog.start(); } catch (e) {}
    };
    recog.start();
  } catch (e) {
    console.warn('Speech recognition unavailable', e);
  }
}

// ---------- Mood picker (shown right away, sent to the assessor once picked) ----------
const moodModal = $('moodModal');
let pendingMood = null;

let walkSensorsReady = false;
async function ensureWalkSensorPermission() {
  if (walkSensorsReady) return;
  walkSensorsReady = true;
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') console.warn('Compass denied — turns need Mark Turn from the assessor.');
    }
  } catch (e) { console.warn('Compass permission request failed', e); }
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      await DeviceMotionEvent.requestPermission();
    }
  } catch (e) { console.warn('Motion permission request failed', e); }
}

function trySendMood() {
  if (pendingMood) {
    wsSend({ type: 'customer-mood', mood: pendingMood.mood, emoji: pendingMood.emoji });
    pendingMood = null;
  }
}
document.querySelectorAll('.mood-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    pendingMood = { mood: btn.dataset.mood, emoji: btn.dataset.emoji };
    trySendMood();
    moodModal.style.display = 'none';
    // Rides on this tap so the remote-started walkthrough has sensors ready.
    ensureWalkSensorPermission();
  });
});

// ---------- Promo banner (marquee, 2 min in, 20s duration, repeats every 10 min) ----------
let callStarted = false;
const promoBanner = $('promoBanner');

function scheduleBanner(delay) {
  setTimeout(() => {
    showBannerOnce();
    scheduleBanner(10 * 60 * 1000); // next appearance 10 minutes after this one starts
  }, delay);
}

function showBannerOnce() {
  promoBanner.style.display = 'block';
  setTimeout(() => {
    promoBanner.style.display = 'none';
  }, 10 * 1000);
}

async function onWsMessage(ev) {
  const msg = JSON.parse(ev.data);
  if (msg.type === 'joined') {
    setStatus('Waiting for assessor…', false);
  } else if (msg.type === 'peer-joined' && msg.role === 'operator') {
    setStatus('Assessor connected — setting up video…', false);
  } else if (msg.type === 'peer-left' && msg.role === 'operator') {
    setStatus('Assessor disconnected', false);
  } else if (msg.type === 'offer') {
    // Can collide with an offer we sent ourselves (see onnegotiationneeded
    // below) if camera permission resolved fast. As the polite side, we
    // always yield: roll back our own offer and accept theirs instead of
    // letting setRemoteDescription throw and silently break the call.
    await ensurePC();
    const offerCollision = makingOffer || pc.signalingState !== 'stable';
    if (offerCollision) {
      await pc.setLocalDescription({ type: 'rollback' });
    }
    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    wsSend({ type: 'answer', sdp: pc.localDescription });
  } else if (msg.type === 'answer') {
    // A stale answer can arrive after we've already rolled back our own
    // offer during a collision — only apply it if we're still waiting.
    if (pc && pc.signalingState === 'have-local-offer') {
      try { await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp)); }
      catch (e) { console.warn('Could not apply answer', e); }
    }
  } else if (msg.type === 'ice-candidate') {
    if (pc && msg.candidate) {
      try { await pc.addIceCandidate(msg.candidate); } catch (e) { console.warn(e); }
    }
  } else if (msg.type === 'remote-drop-pin') {
    placeARPoint();
  } else if (msg.type === 'remote-reset-ar') {
    arPoint1 = null;
    if (xrSession) measureBanner.textContent = 'Reset. Point at the first wall — your assessor will drop the pin.';
  } else if (msg.type === 'remote-end-ar') {
    endAR(true);
  } else if (msg.type === 'remote-start-walk') {
    if (!walkActive) startWalkthrough();
  } else if (msg.type === 'remote-mark-turn') {
    forceWalkTurn();
  } else if (msg.type === 'remote-end-walk') {
    endWalkthrough();
  } else if (msg.type === 'remote-capture-photo') {
    captureAndSendFrame(msg.mode || 'measure');
  } else if (msg.type === 'remote-photo-done') {
    freezeCanvas.style.display = 'none';
    measureBanner.style.display = 'none';
  } else if (msg.type === 'assessor-name') {
    $('remoteLabel').textContent = msg.name ? `Assessor: ${msg.name}` : 'Assessor';
  } else if (msg.type === 'measurement-result') {
    showResult(msg.mode === 'ar' ? 'Wall-to-wall (AR)' : 'Wall-to-wall (estimated)', msg.label, `${msg.distanceMeters} m`);
    freezeCanvas.style.display = 'none';
    measureBanner.style.display = 'none';
  }
}

connectWS();

// Same reattach problem as the assessor side: a dropped socket clears the
// picture-in-picture view of the assessor and nothing ever puts it back.
function attachRemoteTracks() {
  if (!pc) return false;
  const tracks = pc.getReceivers().map((r) => r.track).filter((t) => t && t.readyState === 'live');
  if (!tracks.length) return false;
  const cur = remoteVideo.srcObject;
  const same = cur && cur.getTracks().length === tracks.length &&
    tracks.every((t) => cur.getTracks().includes(t));
  if (!same) {
    remoteVideo.srcObject = new MediaStream(tracks);
    remoteVideo.play().catch(() => {});
  }
  if (pc.connectionState === 'connected') setStatus('Live', true);
  return true;
}

setInterval(() => {
  if (!pc || pc.connectionState !== 'connected') return;
  const v = remoteVideo;
  const live = v.srcObject && v.srcObject.getTracks().some((t) => t.readyState === 'live');
  // Reattach if the picture is gone, but also clear a stale "disconnected"
  // label when the peer came back and the video never actually stopped —
  // otherwise the header keeps saying disconnected over a working call.
  if (!live) attachRemoteTracks();
  else setStatus('Live', true);
}, 3000);

async function ensurePC() {
  if (pc) return;
  pc = new RTCPeerConnection({ iceServers: window.HUD_ICE_SERVERS });
  if (localStream) {
    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  }
  pc.onicecandidate = (e) => {
    if (e.candidate) wsSend({ type: 'ice-candidate', candidate: e.candidate });
  };
  pc.ontrack = () => { attachRemoteTracks(); };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') setStatus('Live', true);
    if (['disconnected', 'failed'].includes(pc.connectionState)) {
      // The assessor drives renegotiation, but a genuinely failed connection
      // has to be torn down here or their fresh offer lands on a dead object.
      setStatus('Reconnecting video…', false);
      setTimeout(() => {
        if (pc && ['disconnected', 'failed'].includes(pc.connectionState)) {
          try { pc.close(); } catch (e) {}
          pc = null;
        }
      }, 4000);
    }
    if (pc && pc.connectionState === 'closed') setStatus('Connection lost', false);
  };
  // The camera permission prompt can take a few seconds for the person to
  // tap "Allow" — often longer than it takes the operator's offer to
  // arrive. When that happens, the initial answer goes out with no local
  // track, and startCamera() below has to add the track *after* the
  // connection is already established. Adding a track post-negotiation
  // doesn't take effect on its own — it fires negotiationneeded, and this
  // handler is what actually renegotiates so the operator ends up
  // receiving the video.
  pc.onnegotiationneeded = async () => {
    try {
      makingOffer = true;
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      wsSend({ type: 'offer', sdp: pc.localDescription });
    } catch (e) {
      console.warn('renegotiation failed', e);
    } finally {
      makingOffer = false;
    }
  };
}

async function startCamera(facing) {
  // Explicit echo cancellation / noise suppression / auto-gain — bare
  // `audio: true` let some devices skip full echo processing, which is
  // what caused the swelling feedback squeal when both sides' mic+speaker
  // were open near each other.
  const constraints = {
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }
  };
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  localVideo.srcObject = stream;
  if (localStream) {
    localStream.getTracks().forEach((t) => t.stop());
  }
  localStream = stream;
  if (pc) {
    const senders = pc.getSenders();
    stream.getTracks().forEach((track) => {
      const sender = senders.find((s) => s.track && s.track.kind === track.kind);
      if (sender) sender.replaceTrack(track); else pc.addTrack(track, stream);
    });
  }
}

startCamera(currentFacing).then(() => ensurePC()).catch((err) => {
  setStatus('Camera access denied — allow camera to continue', false);
  console.error(err);
});

$('flipBtn').addEventListener('click', () => {
  currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
  startCamera(currentFacing).catch(console.error);
});

function sendMeasurement(payload) {
  wsSend({ type: 'measurement', ...payload });
}

function formatMeters(m) {
  const totalIn = m * 39.3701;
  const ft = Math.floor(totalIn / 12);
  const inch = Math.round((totalIn - ft * 12) * 10) / 10;
  return { feet: ft, inches: inch, label: `${ft}' ${inch}"`, meters: Math.round(m * 100) / 100 };
}

// ---------- AR measurement (WebXR hit-test, Android Chrome / ARCore) ----------
// Starting the session has to be a real local tap — browsers require a
// direct user gesture for navigator.xr.requestSession(), no way around
// that. Everything after this one tap (dropping pins, ending the session)
// is driven remotely by the assessor.
const arBtn = $('arBtn');
let xrSession = null;
let xrHitPose = null;
let arPoint1 = null;

async function checkAR() {
  if (navigator.xr && navigator.xr.isSessionSupported) {
    try {
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (supported) arBtn.style.display = '';
    } catch (e) { /* not supported */ }
  }
}
checkAR();

arBtn.addEventListener('click', startAR);

async function startAR() {
  try {
    const glCanvas = document.createElement('canvas');
    const gl = glCanvas.getContext('webgl', { xrCompatible: true });
    await gl.makeXRCompatible();

    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test']
    });
    xrSession.updateRenderState({ baseLayer: new XRWebGLLayer(xrSession, gl) });

    const refSpace = await xrSession.requestReferenceSpace('local');
    const viewerSpace = await xrSession.requestReferenceSpace('viewer');
    const hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

    arPoint1 = null;
    xrHitPose = null;
    arBtn.style.display = 'none';
    $('camRow').style.display = 'none';
    crosshair.style.display = '';
    measureBanner.style.display = '';
    measureBanner.textContent = 'Aim the crosshair at a wall — your assessor will take it from here.';
    wsSend({ type: 'ar-started' });

    xrSession.addEventListener('end', () => onAREnd());

    let lastHitState = null;
    function onXRFrame(t, frame) {
      if (!xrSession) return;
      xrSession.requestAnimationFrame(onXRFrame);
      const layer = xrSession.renderState.baseLayer;
      gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      const hits = frame.getHitTestResults(hitTestSource);
      const hasHit = hits.length > 0;
      if (hasHit) {
        const pose = hits[0].getPose(refSpace);
        xrHitPose = pose.transform.position;
        crosshair.classList.add('hit');
      } else {
        xrHitPose = null;
        crosshair.classList.remove('hit');
      }
      // Only notify the operator when the surface-detected state actually
      // flips, not every frame — keeps the socket quiet during normal use.
      if (hasHit !== lastHitState) {
        lastHitState = hasHit;
        wsSend({ type: 'ar-hit-state', hit: hasHit });
      }
    }
    xrSession.requestAnimationFrame(onXRFrame);
  } catch (err) {
    console.error(err);
    alert('AR measurement is not available on this device/browser. Your assessor can use photo measuring instead.');
    endAR(true);
  }
}

function placeARPoint() {
  if (!xrHitPose) return;
  if (!arPoint1) {
    arPoint1 = { ...xrHitPose };
    measureBanner.textContent = 'First point set. Walk/pan toward the next point.';
  } else {
    const p2 = xrHitPose;
    const dx = p2.x - arPoint1.x, dy = p2.y - arPoint1.y, dz = p2.z - arPoint1.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const f = formatMeters(dist);
    showResult('AR Measurement', f.label, `${f.meters} m`);
    sendMeasurement({ mode: 'ar', distanceMeters: f.meters, label: f.label });
    // Session stays live so multiple measurements (width, height, ceiling,
    // more walls) can be taken back to back — the assessor ends it with
    // "End AR" once they're done with this room, not after every pair.
    arPoint1 = null;
    measureBanner.textContent = 'Measurement logged. Aim at the next point when your assessor is ready for another.';
  }
}

function endAR(cancelled) {
  if (xrSession) {
    try { xrSession.end(); } catch (e) {}
  }
  onAREnd(cancelled);
}

function onAREnd() {
  xrSession = null;
  xrHitPose = null;
  arPoint1 = null;
  crosshair.style.display = 'none';
  crosshair.classList.remove('hit');
  measureBanner.style.display = 'none';
  $('camRow').style.display = '';
  wsSend({ type: 'ar-ended' });
  checkAR();
}

// ---------- Automatic walkthrough map (compass + step tracking) ----------
// There's no real indoor positioning available from browser sensors alone —
// this is dead reckoning (compass heading + step count), which drifts over
// a full walkthrough. Treat the resulting map as a rough sketch of the
// route and turn order, not a precise blueprint. Once "Start Walkthrough"
// is tapped, everything after that (turn detection, waypoint photos, room
// naming) runs automatically — no further taps needed on either screen.
// The assessor's "Mark Turn" button is only a fallback for a missed turn.
let walkActive = false;
let walkOrientationHandler = null;
let walkMotionHandler = null;
let walkSmoothedHeading = null;
let walkLegStartHeading = null;
let walkLastTurnAt = 0;
let walkAccelBaseline = null;
let walkLastStepAt = 0;
let walkStepsThisLeg = 0;
let walkLastLegSendAt = 0;
let walkPhotoTimer = null;
const WALK_TURN_THRESHOLD_DEG = 35;
const WALK_TURN_DEBOUNCE_MS = 900;
const WALK_STRIDE_FT = 2.2;

function angleDiff(a, b) {
  let d = (a - b) % 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return d;
}

function getCompassHeading(e) {
  if (typeof e.webkitCompassHeading === 'number') return e.webkitCompassHeading; // iOS Safari
  if (e.absolute && typeof e.alpha === 'number') return (360 - e.alpha) % 360; // Android absolute compass
  return null; // non-absolute alpha isn't a reliable compass reading — skip it
}

function handleWalkOrientation(e) {
  const heading = getCompassHeading(e);
  if (heading == null) return;
  walkSmoothedHeading = walkSmoothedHeading == null ? heading : walkSmoothedHeading + angleDiff(heading, walkSmoothedHeading) * 0.2;
  if (walkLegStartHeading == null) walkLegStartHeading = walkSmoothedHeading;
  const diff = angleDiff(walkSmoothedHeading, walkLegStartHeading);
  const now = Date.now();
  if (Math.abs(diff) > WALK_TURN_THRESHOLD_DEG && now - walkLastTurnAt > WALK_TURN_DEBOUNCE_MS) {
    walkLastTurnAt = now;
    const direction = diff > 0 ? 'right' : 'left';
    wsSend({ type: 'walk-turn', direction, angle: Math.abs(diff) });
    walkLegStartHeading = walkSmoothedHeading;
    walkStepsThisLeg = 0;
    captureAndSendFrame('walk');
  }
}

function handleWalkMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a) return;
  const mag = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
  if (walkAccelBaseline == null) walkAccelBaseline = mag;
  walkAccelBaseline = walkAccelBaseline * 0.9 + mag * 0.1;
  const now = Date.now();
  if (mag - walkAccelBaseline > 3.2 && now - walkLastStepAt > 280) {
    walkLastStepAt = now;
    walkStepsThisLeg++;
    if (now - walkLastLegSendAt > 400) {
      walkLastLegSendAt = now;
      wsSend({ type: 'walk-leg-update', legFt: Math.round(walkStepsThisLeg * WALK_STRIDE_FT * 10) / 10 });
    }
  }
}

function scheduleWalkPhoto() {
  clearTimeout(walkPhotoTimer);
  walkPhotoTimer = setTimeout(() => {
    if (!walkActive) return;
    captureAndSendFrame('walk');
    scheduleWalkPhoto();
  }, 6000);
}

async function startWalkthrough() {
  if (walkActive) { endWalkthrough(); return; }
  // Fire the start immediately, before touching sensor permissions — the
  // operator's live map should always begin drawing the instant this is
  // tapped. Sensor permission prompts (iOS especially) can be denied,
  // dismissed, or fail in ways that used to abort the whole walkthrough
  // silently; now a denial just means turns need "Mark Turn" instead of
  // being auto-detected, it never blocks the walkthrough from starting.
  walkActive = true;
  walkSmoothedHeading = null;
  walkLegStartHeading = null;
  walkAccelBaseline = null;
  walkStepsThisLeg = 0;
  walkLastTurnAt = 0;
  wsSend({ type: 'walk-started' });
  captureAndSendFrame('walk');
  scheduleWalkPhoto();

  // Permission was already taken care of on the mood tap; this is only a
  // backstop for the case where that never happened.
  await ensureWalkSensorPermission();
  walkOrientationHandler = handleWalkOrientation;
  walkMotionHandler = handleWalkMotion;
  window.addEventListener('deviceorientationabsolute', walkOrientationHandler);
  window.addEventListener('deviceorientation', walkOrientationHandler);
  window.addEventListener('devicemotion', walkMotionHandler);
}

function forceWalkTurn() {
  if (!walkActive) return;
  const diff = walkLegStartHeading != null && walkSmoothedHeading != null ? angleDiff(walkSmoothedHeading, walkLegStartHeading) : 0;
  const direction = diff >= 0 ? 'right' : 'left';
  wsSend({ type: 'walk-turn', direction, angle: Math.max(Math.abs(diff), 15) });
  walkLegStartHeading = walkSmoothedHeading;
  walkLastTurnAt = Date.now();
  walkStepsThisLeg = 0;
  captureAndSendFrame('walk');
}

function endWalkthrough() {
  if (!walkActive) return;
  walkActive = false;
  clearTimeout(walkPhotoTimer);
  if (walkOrientationHandler) {
    window.removeEventListener('deviceorientationabsolute', walkOrientationHandler);
    window.removeEventListener('deviceorientation', walkOrientationHandler);
  }
  if (walkMotionHandler) window.removeEventListener('devicemotion', walkMotionHandler);
  wsSend({ type: 'walk-ended' });
}


// Triggered remotely by the operator — grabs the current frame and sends
// it over so the assessor can do the measuring taps on their own screen.
function captureAndSendFrame(mode) {
  try {
    const fctx = freezeCanvas.getContext('2d');
    const vw = localVideo.videoWidth, vh = localVideo.videoHeight;
    if (!vw || !vh) {
      // Camera not actually streaming yet (permission still pending, tab
      // backgrounded, etc). Previously this failed completely silently —
      // the assessor's button would just reset after a few seconds with no
      // explanation. Tell them what happened instead.
      wsSend({ type: 'photo-capture-failed', reason: 'Camera not ready on the homeowner\'s device yet' });
      return;
    }
    const cw = freezeCanvas.width, ch = freezeCanvas.height;
    const scale = Math.max(cw / vw, ch / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    fctx.drawImage(localVideo, dx, dy, dw, dh);
    freezeCanvas.style.display = '';
    measureBanner.style.display = '';
    measureBanner.textContent = mode === 'document'
      ? 'Hold steady — your assessor is taking a photo.'
      : 'Hold steady — your assessor is measuring from this photo.';
    const dataUrl = freezeCanvas.toDataURL('image/jpeg', 0.6);
    wsSend({ type: 'photo-frame', image: dataUrl, width: cw, height: ch, mode: mode || 'measure' });
  } catch (e) {
    console.error('Photo capture failed', e);
    wsSend({ type: 'photo-capture-failed', reason: e.message || 'Unknown error capturing photo' });
  }
}

function showResult(label, big, sub) {
  resultLabel.textContent = label;
  resultBig.textContent = big;
  resultCard.style.display = 'block';
  let subEl = resultCard.querySelector('.sub');
  if (!subEl) {
    subEl = document.createElement('div');
    subEl.className = 'sub';
    subEl.style.cssText = 'color:#aaa;font-size:12px;margin-bottom:6px;';
    resultCard.insertBefore(subEl, resultCard.querySelector('.row'));
  }
  subEl.textContent = sub || '';
}

$('resultCloseBtn').addEventListener('click', () => {
  resultCard.style.display = 'none';
});
</script>
</body>
